<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Mandarin HSK 1</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#2d2a45;--mut:#7d7a99;--pri:#6c5ce7;--pri2:#a29bfe;--ok:#00b894;--okbg:#e0f8f2;--bad:#ff5e6c;--badbg:#ffe8ea;--bd:#e4e0fa;--sh:0 6px 20px rgba(108,92,231,.12)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 70px}
.hero{background:linear-gradient(135deg,#6c5ce7,#a29bfe 60%,#fd79a8);color:#fff;border-radius:24px;padding:26px 22px;box-shadow:var(--sh);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hero h1{margin:0;font-size:1.7rem;font-weight:800;line-height:1.2}
.hero p{margin:6px 0 0;opacity:.92}
.btn{background:var(--pri);color:#fff;border:0;border-radius:16px;padding:14px 26px;font:800 1rem Nunito,system-ui;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:none}
.btn.cta{background:#fff;color:var(--pri);font-size:1.05rem}
.btn.alt{background:var(--card);color:var(--pri);border:2px solid var(--bd);box-shadow:none}
.btn.sm{padding:9px 16px;font-size:.92rem;border-radius:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:14px 16px 14px 46px;border:2px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:600 1rem Nunito,system-ui;outline:0;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(108,92,231,.15)}
.search i{position:absolute;left:16px;top:12px;font-style:normal;font-size:1.15rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 16px;font:700 .92rem Nunito,system-ui;cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;transform:scale(1.04)}
.chip small{opacity:.7;margin-left:5px}
.cnt{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.w{position:relative;background:var(--card);border-radius:20px;padding:30px 12px 16px;text-align:center;box-shadow:var(--sh);cursor:pointer;border:2px solid transparent;transition:transform .2s,border-color .2s;animation:up .35s both}
.w:hover{transform:translateY(-4px);border-color:var(--pri2)}.w:active{transform:scale(.97)}
.w .no{position:absolute;top:10px;left:12px;background:var(--bg);color:var(--mut);font-weight:800;font-size:.78rem;border-radius:999px;padding:1px 9px}
.w .sp{position:absolute;top:8px;right:10px;font-size:1.05rem;opacity:.7}
.w .hz{font-size:2.5rem;font-weight:800;color:var(--pri);line-height:1.2}
.w .py{font-weight:800;margin-top:4px}
.w .ar{color:var(--mut);font-size:.92rem}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.empty{padding:40px;text-align:center;color:var(--mut)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.head h1{margin:0;font-size:1.5rem;font-weight:800}.head p{margin:0;color:var(--mut);font-size:.92rem}
.card{position:relative;background:var(--card);border-radius:24px;padding:24px 20px;margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-weight:700;font-size:.92rem}
.prog{height:12px;background:var(--bd);border-radius:12px;overflow:hidden;margin:8px 0 18px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6c5ce7,#fd79a8);border-radius:12px;transition:width .4s}
.big{text-align:center;font-size:5rem;font-weight:800;color:var(--pri);line-height:1.2;background:var(--bg);border-radius:20px;padding:14px;margin-bottom:10px}
.big button{border:0;background:var(--card);border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer;vertical-align:middle;margin-left:6px;box-shadow:var(--sh)}
.q{text-align:center;color:var(--mut);font-weight:700;margin:12px 0}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin:10px 0;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;font:700 1.02rem Nunito,system-ui;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.opt b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--pri);display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--pri);transform:translateX(4px)}
.opt.right{border-color:var(--ok);background:var(--okbg);animation:pop .5s}.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .45s}.opt.wrong b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hint{text-align:center;min-height:1.6em;color:var(--bad);font-weight:800}
.toast{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,184,148,.94);color:#fff;font-size:2rem;font-weight:800;opacity:0;pointer-events:none;z-index:5}
.toast span{font-size:4rem}
.toast.show{animation:toast 1.1s ease both}
@keyframes toast{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1.05)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.confetti{position:absolute;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:6;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.emo{text-align:center;font-size:3.5rem}
.score{text-align:center;font-size:2.4rem;font-weight:800;color:var(--pri)}
.msg{text-align:center;font-weight:800;font-size:1.2rem}
.rv{border-left:6px solid var(--ok);background:var(--okbg);border-radius:16px;padding:12px 16px;margin:10px 0}
.rv.bad{border-color:var(--bad);background:var(--badbg)}
.rv .hz{font-size:1.8rem;font-weight:800;margin-right:8px}
.tag{font-weight:800}.ok{color:var(--ok)}.no{color:var(--bad)}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:rgba(20,18,40,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:up .2s}
.dlg{background:var(--card);border-radius:24px;padding:26px;max-width:380px;width:100%;text-align:center;animation:pop .3s}
.dlg .e{font-size:2.8rem}.dlg p{font-size:1.15rem;font-weight:700;margin:6px 0 18px}
.dlg .bar{justify-content:center;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){.big{font-size:4rem}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.hero h1{font-size:1.4rem}.hero .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">

<section id="p1">
  <div class="hero">
    <div><h1>你好! 👋 Belajar Mandarin HSK 1</h1>
    <p>150 kata dasar. Ketuk kartu untuk mendengar pelafalannya 🔊</p></div>
    <button class="btn cta" onclick="go('kuis')">🎯 Mulai Kuis</button>
  </div>
  <div class="search"><i>🔍</i><input type="search" id="cari" placeholder="Cari hanzi, pinyin, atau arti…"></div>
  <div class="chips" id="chips"></div>
  <p class="cnt" id="cnt"></p>
  <div class="grid" id="gr"></div>
  <div class="empty hide" id="empty">😅 Tidak ada kosakata yang cocok.</div>
</section>

<section id="p2" class="hide">
  <div class="head">
    <div><h1>🎯 Kuis HSK 1</h1><p>Pilih pinyin + arti yang tepat</p></div>
    <button class="btn alt sm" onclick="tanyaKeluar()">← Kembali</button>
  </div>

  <div id="setup" class="card">
    <b>Mau berapa soal?</b>
    <div class="pills" id="pills"></div>
    <button class="btn" onclick="mulai()">🚀 Mulai</button>
  </div>

  <div id="play" class="hide">
    <div class="card" id="qcard">
      <div class="toast" id="toast"><span>🎉</span>Anda Benar!</div>
      <div class="top"><span id="info"></span><span id="streak"></span></div>
      <div class="prog"><i id="pb"></i></div>
      <div class="big"><span id="hz"></span><button onclick="say(S[i].w[1])" aria-label="Dengar">🔊</button></div>
      <div class="q">Apa pinyin dan artinya?</div>
      <div id="opts"></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <div id="hasil" class="hide">
    <div class="card">
      <div class="emo" id="emo"></div>
      <div class="msg" id="msg"></div>
      <div class="score" id="sk"></div>
      <p class="q" id="sk2"></p>
      <div class="bar" style="justify-content:center">
        <button class="btn" onclick="mulai()">🔁 Ulangi Kuis</button>
        <button class="btn alt" onclick="go('')">📚 Daftar Kosakata</button>
      </div>
    </div>
    <h3>📝 Pembahasan</h3>
    <div id="rv"></div>
  </div>
</section>
</div>

<div class="ov hide" id="dlg" role="dialog" aria-modal="true">
  <div class="dlg"><div class="e">🥺</div>
    <p>Apakah Anda yakin ingin keluar dari kuis?</p>
    <div class="bar">
      <button class="btn" onclick="go('');tutup()">Ya, Keluar</button>
      <button class="btn alt" onclick="tutup()">Batal</button>
    </div>
  </div>
</div>

const KAT=["Angka dan Nomor", "Kata Kerja", "Keluarga", "Kata Ganti Orang", "Kata Sifat", "Waktu", "Kata Tanya", "Partikel dan Penghubung", "Ungkapan", "Tempat dan Lokasi", "Benda Orang Lainnya"];
const $=id=>document.getElementById(id), L="ABCD";

function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function go(h){location.hash=h}
function route(){const k=location.hash==="#kuis";$("p1").classList.toggle("hide",k);$("p2").classList.toggle("hide",!k);if(k)reset();scrollTo(0,0)}
addEventListener("hashchange",route);

function tanyaKeluar(){$("dlg").classList.remove("hide")}
function tutup(){$("dlg").classList.add("hide")}
$("dlg").onclick=e=>{if(e.target===$("dlg"))tutup()};
addEventListener("keydown",e=>{if(e.key==="Escape")tutup()});

let kat="Semua";
function chips(){
  $("chips").innerHTML=["Semua",...KAT].map(k=>{
    const n=k==="Semua"?D.length:D.filter(w=>w[4]===k).length;
    return `<button class="chip${k===kat?" on":""}" onclick="setKat(this.dataset.k)" data-k="${k}">${k}<small>${n}</small></button>`}).join("");
}
function setKat(k){kat=k;chips();tampil()}
function tampil(){
  const f=$("cari").value.toLowerCase().trim();
  const r=D.map((w,n)=>[w,n]).filter(([w])=>(kat==="Semua"||w[4]===kat)&&(!f||w.slice(1,4).join(" ").toLowerCase().includes(f)));
  $("gr").innerHTML=r.map(([w,n],k)=>`<div class="w" style="animation-delay:${Math.min(k,20)*15}ms" onclick="say(D[${n}][1])"><span class="no">${w[0]}</span><span class="sp">🔊</span><div class="hz">${w[1]}</div><div class="py">${w[2]}</div><div class="ar">${w[3]}</div></div>`).join("");
  $("empty").classList.toggle("hide",r.length>0);
  $("cnt").textContent=`Menampilkan ${r.length} kosakata`+(kat==="Semua"?"":` · ${kat}`);
}
$("cari").oninput=tampil;

let S=[],i=0,kunci=false,N=10,streak=0;
const teks=w=>w[2]+" — "+w[3];
const acak=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pills(){$("pills").innerHTML=[10,20,50,150].map(n=>`<button class="chip${n===N?" on":""}" onclick="N=${n};pills()">${n===150?"Semua (150)":n+" soal"}</button>`).join("")}

function reset(){$("setup").classList.remove("hide");$("play").classList.add("hide");$("hasil").classList.add("hide");pills()}
function mulai(){
  S=acak(D).slice(0,N).map(w=>({w,salah:[],opts:acak([w,...acak(D.filter(x=>teks(x)!==teks(w))).slice(0,3)])}));
  i=0;streak=0;$("toast").classList.remove("show");
  $("setup").classList.add("hide");$("hasil").classList.add("hide");$("play").classList.remove("hide");
  scrollTo(0,0);soal();
}
function soal(){
  const q=S[i];kunci=false;$("toast").classList.remove("show");
  $("info").textContent=`Soal ${i+1} dari ${S.length}`;
  $("streak").textContent=streak>1?`🔥 ${streak} beruntun`:"";
  $("pb").style.width=(i/S.length*100)+"%";
  $("hz").textContent=q.w[1];$("hint").textContent="";
  $("opts").innerHTML=q.opts.map((o,k)=>`<button class="opt" onclick="pilih(${k},this)"><b>${L[k]}</b>${teks(o)}</button>`).join("");
}
function pilih(k,el){
  if(kunci)return;
  const q=S[i];
  if(q.opts[k]===q.w){
    kunci=true;streak=q.salah.length?0:streak+1;
    el.classList.add("right");
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    $("hint").textContent="";$("pb").style.width=((i+1)/S.length*100)+"%";
    efekBenar(el);
    setTimeout(()=>{i++;i<S.length?soal():selesai()},1300);
  }else{
    if(!q.salah.includes(k))q.salah.push(k);
    el.classList.add("wrong");el.disabled=true;
    $("hint").textContent="Belum tepat, coba lagi! 💪";
  }
}
function efekBenar(el){
  const t=$("toast");t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
  const c=$("qcard"),cr=c.getBoundingClientRect(),er=el.getBoundingClientRect();
  const ox=er.left-cr.left+er.width/2,oy=er.top-cr.top+er.height/2,col=["#fdcb6e","#fd79a8","#00b894","#74b9ff","#a29bfe"];
  for(let n=0;n<28;n++){
    const s=document.createElement("span");s.className="confetti";
    const a=Math.random()*Math.PI*2,d=70+Math.random()*130;
    s.style.cssText=`left:${ox}px;top:${oy}px;background:${col[n%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-40}px;--r:${Math.random()*720-360}deg`;
    c.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}
function selesai(){
  $("play").classList.add("hide");$("hasil").classList.remove("hide");
  let benar=0,h="";
  S.forEach((q,n)=>{
    const ok=q.salah.length===0,bn=q.opts.indexOf(q.w);
    if(ok)benar++;
    h+=`<div class="rv${ok?"":" bad"}"><span class="hz">${q.w[1]}</span><span class="tag ${ok?"ok":"no"}">${n+1}. ${ok?"Benar ✓":"Salah ✗"}</span>`
     +(ok?`<div>Jawaban: ${L[bn]}. ${teks(q.w)}</div>`
         :`<div>Jawabanmu yang salah: <span class="no">${q.salah.map(k=>L[k]+". "+teks(q.opts[k])).join(" · ")}</span></div><div>Jawaban benar: <span class="ok"><b>${L[bn]}. ${teks(q.w)}</b></span></div>`)
     +`</div>`;
  });
  const p=Math.round(benar/S.length*100);
  const [e,m]=p>=90?["🏆","Luar biasa!"]:p>=70?["🔥","Keren, hampir sempurna!"]:p>=50?["💪","Lumayan, terus berlatih!"]:["🌱","Tenang, ulangi lagi pasti makin lancar!"];
  $("emo").textContent=e;$("msg").textContent=m;
  $("sk").textContent=`${benar} / ${S.length}  (${p}%)`;
  $("sk2").textContent=`Benar di percobaan pertama: ${benar} · Sempat salah: ${S.length-benar}`;
  $("rv").innerHTML=h;scrollTo(0,0);
}

chips();tampil();route();
</script>
